# Scans the whole git history for committed secrets (SEC-03, D-23).
# The second of three layers: the pre-commit hook, this job, and GitHub push protection.
#
# Uses the pinned gitleaks image, the same version as scripts/scan-staged-secrets.sh.
# Not the gitleaks GitHub Action: it needs a paid licence for organisation-owned repositories.
name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, not only the latest one.
          fetch-depth: 0
      - name: Scan the full git history
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
        run: |
          set -u

          # This job must never pass without scanning. In a checkout gitleaks cannot read
          # as a git repository it prints "0 commits scanned", "no leaks found" and exits 0.
          # So: refuse a shallow checkout, count the commits that have a diff on the host
          # (the same ones gitleaks reads), and require gitleaks to report the same count.
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::The checkout is shallow, so the scan would miss history."
            exit 1
          fi
          expected=$(git log -p -U0 --full-history --all --format='commit %H' | awk '/^commit [0-9a-f]+$/ { if (has) n++; has = 0; next } /^diff --git / { has = 1 } END { if (has) n++; print n + 0 }')
          if [ "$expected" -lt 1 ]; then
            echo "::error::Found no commits with a diff to scan."
            exit 1
          fi

          # The repository is mounted read-only. safe.directory lets git inside the
          # container read a workspace owned by the runner user.
          log="$RUNNER_TEMP/gitleaks.log"
          status=0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" detect --source /repo --redact --no-banner --no-color >"$log" 2>&1 || status=$?
          cat "$log"

          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks exited with status $status (leaks found or the scan failed)."
            exit 1
          fi
          scanned=$(grep -Eo '[0-9]+ commits scanned' "$log" | grep -Eo '^[0-9]+' | tail -n 1)
          if [ "${scanned:-0}" != "$expected" ]; then
            echo "::error::gitleaks scanned ${scanned:-0} commits but the repository has $expected commits with a diff. The scan did not cover the history."
            exit 1
          fi
          echo "gitleaks scanned all $scanned commits with a diff and found no leaks."
