name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this.

        **Do not report security vulnerabilities here.** An issue is public. Follow the repository's security policy (SECURITY.md) to report privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in a few sentences. Include any error message exactly as shown.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that make the problem appear.
      placeholder: |
        1. Run `docker compose up`
        2. Open the home page
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit hash (`git rev-parse --short HEAD`) or the release you are running.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, Docker version, and anything else that might matter.
    validations:
      required: true
