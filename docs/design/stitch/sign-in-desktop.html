<!DOCTYPE html>

            "error": "#ba1a1a",

          "borderRadius": {

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      font-size: 18px;
      line-height: 1;
      display: inline-block;
    }
  </style>
</head>
<body class="h-full bg-surface text-on-surface antialiased flex flex-col justify-between selection:bg-primary/10 selection:text-primary">
<!-- Main Content Centered Viewport -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-12">
<div class="w-full max-w-[400px]">
<!-- Brand Header Above Card -->
<div class="flex items-center justify-center gap-2 mb-6">
<div class="w-8 h-8 rounded-lg bg-primary-container text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" data-icon="hub">hub</span>
</div>
<span class="font-headline-sm text-headline-sm font-bold text-on-surface tracking-tight">OpenCRM</span>
<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-surface-variant text-on-surface-variant border border-outline-variant/40">
          OSS
        </span>
</div>
<!-- Authentication Card Container -->
<div class="bg-surface-container-lowest border border-outline-variant/60 rounded-xl shadow-sm p-8">
<!-- Card Heading & Description -->
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Sign in</h1>
<p class="font-body-md text-body-md text-outline mt-1">Use your work email and password.</p>
</div>
<!-- Inline Error Alert -->
<div class="bg-error-container/40 border border-error/20 text-on-error-container rounded-lg p-3 my-5 flex items-start gap-2.5 font-body-md text-body-md" role="alert">
<span class="material-symbols-outlined text-error flex-shrink-0 mt-0.5" data-icon="error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="font-medium text-error leading-5">Email or password is incorrect.</span>
</div>
<!-- Form Elements -->
<form class="space-y-4" id="login-form" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="email">
              Email
            </label>
<input autocomplete="email" class="h-10 px-3 w-full rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline/70 font-body-md text-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 outline-none transition-shadow" id="email" name="email" placeholder="alex@company.com" required="" type="email" value="alex.chen@acme.corp"/>
</div>
<!-- Password Input Field -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">
                Password
              </label>
<a class="font-label-md text-label-md text-primary-container hover:underline transition-colors focus:outline-none focus:ring-1 focus:ring-primary-container rounded" href="#">
                Forgot password?
              </a>
</div>
<div class="relative">
<input autocomplete="current-password" class="h-10 px-3 pr-10 w-full rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline/70 font-body-md text-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 outline-none transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password" value="secretpassword"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-10 w-10 flex items-center justify-center text-outline hover:text-on-surface transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Submit Action Button -->
<div class="pt-2">
<button class="w-full h-10 bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md rounded-lg transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 flex items-center justify-center" type="submit">
              Sign in
            </button>
</div>
</form>
</div>
</div>
</main>
<!-- Minimal Footer Derived from Shared Component Anchor -->
<footer class="w-full py-6 border-t border-outline-variant/30">
<div class="w-full max-w-md mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
<p class="font-body-sm text-body-sm text-outline">
        © 2025 OpenCRM. Open source under Apache 2.0.
      </p>
<div class="flex items-center gap-4 font-body-sm text-body-sm text-outline">
<a class="hover:text-on-surface transition-colors duration-150" href="#">Documentation</a>
<a class="hover:text-on-surface transition-colors duration-150" href="#">GitHub</a>
</div>
</div>
</footer>
<script>
    // Password visibility toggle micro-interaction
    const toggleButton = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        eyeIcon.setAttribute('data-icon', isPassword ? 'visibility_off' : 'visibility');
      });
    }
  </script>
</body></html>
