<body class="bg-background text-on-surface font-body-md text-body-md min-h-full flex flex-col justify-between antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<main class="flex-1 flex flex-col items-center justify-center px-4 py-12 sm:px-6">
<div class="w-full max-w-[420px]">
<!-- Logo Mark and Wordmark -->
<div class="flex items-center justify-center gap-2.5 mb-6">
<div class="h-9 w-9 rounded-lg bg-primary-container flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="hub">hub</span>
</div>
<div class="flex items-center gap-2">
<span class="text-headline-sm font-headline-sm tracking-tight text-on-surface">OpenCRM</span>
<span class="px-1.5 py-0.5 rounded text-[11px] font-medium bg-surface-container text-on-surface-variant border border-outline-variant/40">OSS</span>
</div>
</div>
<!-- Authentication Card Container -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/60 shadow-sm p-8">
<!-- Heading -->
<h1 class="text-headline-lg font-headline-lg text-on-surface tracking-tight">Set your password</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-1 mb-6">
          Welcome, Elena. You were invited to OpenCRM as a Sales Rep.
        </p>
<!-- Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Field (Read-only / Disabled) -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-1.5" for="email">Email</label>
<input class="w-full h-9 px-3 text-body-md font-body-md bg-surface-container-low text-on-surface-variant border border-outline-variant/60 rounded-lg cursor-not-allowed select-none focus:outline-none" id="email" name="email" readonly="" tabindex="-1" type="email" value="e.rostova@acme.corp"/>
</div>
<!-- New Password Field -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-1.5" for="new-password">New password</label>
<div class="relative">
<input class="w-full h-9 pl-3 pr-10 text-body-md font-body-md bg-surface-container-lowest border border-error ring-1 ring-error rounded-lg focus:outline-none focus:ring-2 focus:ring-error transition-shadow" id="new-password" name="new-password" type="password" value="password123"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
<!-- Inline Error Message -->
<div class="flex items-center gap-1 mt-1.5 text-error text-label-sm font-label-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="error">error</span>
<span>This password is too common. Choose another.</span>
</div>
<!-- Helper Text -->
<p class="text-body-sm font-body-sm text-on-surface-variant mt-1">
              At least 10 characters.
            </p>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-9 px-3.5 bg-primary-container hover:bg-primary text-on-primary font-medium text-body-md font-body-md rounded-lg shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-primary-container/30 focus:ring-offset-1 flex items-center justify-center" type="submit">
              Set password and sign in
            </button>
</div>
</form>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-6 border-t border-outline-variant/30">
<div class="w-full max-w-md mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left text-body-sm font-body-sm text-on-surface-variant">
<span>© 2025 OpenCRM. Open source under Apache 2.0.</span>
<div class="flex items-center gap-4">
<a class="hover:text-on-surface transition-colors duration-150" href="#documentation">Documentation</a>
<a class="hover:text-on-surface transition-colors duration-150" href="#github">GitHub</a>
</div>
</div>
</footer>
<script>
    const toggleButton = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('new-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeIcon.textContent = 'visibility_off';
          eyeIcon.setAttribute('data-icon', 'visibility_off');
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeIcon.textContent = 'visibility';
          eyeIcon.setAttribute('data-icon', 'visibility');
        }
      });
    }
  </script>
