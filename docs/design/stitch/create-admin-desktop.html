<body class="h-full bg-background text-on-surface antialiased flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed">
<div class="flex-1 flex flex-col items-center justify-center px-4 py-12 sm:px-6">
<div class="w-full max-w-[400px] flex flex-col items-center">
<!-- Brand Logo Header -->
<div class="flex items-center gap-2 mb-8">
<div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="deployed_code" style="font-variation-settings: 'FILL' 1;">deployed_code</span>
</div>
<span class="font-headline-md text-headline-md tracking-tight text-on-surface font-bold">OpenCRM</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-surface-container-high text-on-surface-variant border border-outline-variant/40 ml-1">
          OSS
        </span>
</div>
<!-- Main Setup Card -->
<div class="w-full bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-sm p-8">
<div class="mb-6">
<h1 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">
            Create the Admin account
          </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 leading-relaxed">
            This is a new OpenCRM install. The first account becomes the Admin.
          </p>
</div>
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface font-medium mb-1.5" for="fullname">
              Full name
            </label>
<input autocomplete="name" class="w-full h-9 px-3 text-body-md font-body-md rounded-lg bg-surface-container-lowest border border-outline-variant/50 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all" id="fullname" name="fullname" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email Address -->
<div>
<label class="block font-label-md text-label-md text-on-surface font-medium mb-1.5" for="email">
              Email
            </label>
<input autocomplete="email" class="w-full h-9 px-3 text-body-md font-body-md rounded-lg bg-surface-container-lowest border border-outline-variant/50 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all" id="email" name="email" placeholder="admin@acme.corp" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface font-medium mb-1.5" for="password">
              Password
            </label>
<div class="relative">
<input autocomplete="new-password" class="w-full h-9 pl-3 pr-10 text-body-md font-body-md rounded-lg bg-surface-container-lowest border border-outline-variant/50 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all" id="password" minlength="10" name="password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-2.5 text-outline hover:text-on-surface transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1.5">
              At least 10 characters.
            </p>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-9 px-4 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md font-medium hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 flex items-center justify-center shadow-sm" type="submit">
              Create account
            </button>
</div>
</form>
</div>
</div>
</div>
<!-- Footer Component matching OpenCRM Shared Anchors -->
<footer class="w-full py-6 border-t border-outline-variant/30 dark:border-outline-variant/20 bg-transparent">
<div class="w-full max-w-md mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left text-body-sm font-body-sm text-on-surface-variant">
<span>© 2025 OpenCRM. Open source under Apache 2.0.</span>
<div class="flex items-center gap-4">
<a class="text-on-surface-variant hover:text-on-surface transition-colors duration-150" href="#docs">Documentation</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors duration-150" href="#github">GitHub</a>
</div>
</div>
</footer>
<script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</body></html>
