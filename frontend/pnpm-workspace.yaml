# Install scripts run only for these packages (pnpm 11 blocks all others)
allowBuilds:
  unrs-resolver: true
  sharp: true

# Added by pnpm when resolving the lockfile: these two releases were younger than
# the one-day minimumReleaseAge gate on 2026-10-08. Remove once they are a day old.
minimumReleaseAgeExclude:
  - "@shadcn/registry@0.1.3"
  - shadcn@4.21.4

# Accepted advisory, dated 2026-10-08 (D-24, owner decision pending at plan 01-01 Task 3).
# GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 stack exhaustion on deeply nested glob patterns.
# No patched version is published (braces 3.0.3 and micromatch 4.0.8 are the latest).
# Reached only through build-time tooling (eslint-config-next, shadcn CLI) that globs
# patterns we write ourselves; braces is not part of the shipped application.
# Remove this entry as soon as a patched braces is published and the lockfile picks it up.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
